<script src="https://youtube.com/playlist?list=PLHLdB1EngoPWYzLj19OItQQ0dTWbRC2Hj&si=QQoh6JGi1zC8-1Fb"></script>

<script>
let player;
let isPlaying = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    height: '0',
    width: '0',
    playerVars: {
      listType: 'playlist',
      list: 'YOUR_PLAYLIST_ID', // replace here
      autoplay: 0,
      controls: 0
    }
  });
}

document.getElementById("playPause").onclick = () => {
  if (!isPlaying) {
    player.playVideo();
    isPlaying = true;
    playPause.textContent = "⏸";
  } else {
    player.pauseVideo();
    isPlaying = false;
    playPause.textContent = "▶";
  }
};

document.getElementById("next").onclick = () => {
  player.nextVideo();
};
</script>

<style>
#controls {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  gap: 10px;
}

button {
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;

  backdrop-filter: blur(10px);
}
